      content: >-
        <img src="systems/penombre/assets/guide/menu-penombre.webp" alt="Menu
        Pénombre de la barre latérale" /><p>L'onglet Pénombre de la barre
        latérale regroupe :</p><h2>Support</h2><p>Les liens vers le Discord de
        la Fonderie, le Discord d'Æther Labs, les ressources pour Pénombre, le
        signalement de bugs et la présentation vidéo du
        système.</p><h2>Système</h2><ul><li><p><strong>Réserve
        collégiale</strong> : ouvre la réserve collégiale (ou la feuille
        collégiale étendue avec le Jeu des
        factions).</p></li><li><p><strong>Rappel des règles</strong> : ouvre
        dans une fenêtre indépendante le rappel des dépenses de jetons et du
        tableau des résultats, pour tout le monde, que le rappel soit affiché ou
        non sur la fiche.</p></li><li><p><strong>Gestionnaire de groupe</strong>
        (MJ seulement) : voir la page suivante.</p></li></ul><img
        src="systems/penombre/assets/guide/rappel-regles.webp" alt="Fenêtre du
        rappel des règles" />
