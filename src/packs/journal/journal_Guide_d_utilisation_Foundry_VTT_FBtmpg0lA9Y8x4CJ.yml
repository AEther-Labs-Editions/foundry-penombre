name: Guide d'utilisation Foundry VTT
pages:
  - sort: 40000
    name: Comment lancer les dés
    type: text
    _id: NbsQ1cortQsp55q0
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Vous ne pouvez lancer les dés qu'en Mode Jouer. Cliquez sur le dé de
        l'harmonique applicable, dans la zone Harmoniques de la fiche : la
        fenêtre de lancer apparaît.</p><img
        src="systems/penombre/assets/guide/fiche_jet.webp" alt="Fenêtre de
        lancer de dés" /><h2>Les options du
        lancer</h2><ul><li><p><strong>Harmonique</strong> : le dé lancé ; cochez
        <strong>Plutôt le Dé merveilleux</strong> pour le remplacer par le D20
        merveilleux (1 jeton).</p></li><li><p><strong>Difficulté</strong> de
        l'action.</p></li><li><p><strong>Action collégiale</strong> : voir plus
        bas.</p></li><li><p><strong>Effet magique</strong> : choisissez la
        <strong>maîtrise utilisée</strong> et le <strong>niveau de
        l'effet</strong>. Produire un effet magique coûte 1 jeton, comme
        compenser un niveau de maîtrise manquant ; plusieurs effets magiques
        peuvent être produits par un même
        jet.</p></li><li><p><strong>Atouts</strong> : cliquez sur les atouts
        mobilisés. La case <strong>Bonus total</strong> donne la somme de leurs
        niveaux.</p></li><li><p><strong>Formule</strong> : le champ
        <strong>Bonus</strong> permet d'ajouter 1d20 ou xd6 (x étant un
        entier).</p></li><li><p><strong>Visibilité</strong> : reprend par défaut
        celle choisie dans les options du tchat.</p></li></ul><h2>Les
        jetons</h2><p>Le nombre de <strong>jetons à dépenser</strong> est
        calculé automatiquement d'après vos choix. Répartissez cette dépense
        entre votre conscience et la réserve collégiale dans la zone
        <strong>Dépense automatique</strong> : si le total réparti n'est pas
        égal au nombre de jetons à dépenser, vous ne pourrez pas lancer les
        dés.</p><ul><li><p>Le maximum de chaque source correspond aux jetons
        disponibles à l'ouverture de la fenêtre ; un avertissement apparaît si
        la réserve collégiale en compte moins que vous n'en
        demandez.</p></li><li><p>Pour une action standard, le premier atout est
        gratuit. Pour une action collégiale, il ne l'est que si vous cochez
        <strong>J'ai choisi le premier atout…</strong></p></li><li><p>Les
        réserves sollicitées sont mises à jour
        automatiquement.</p></li></ul><h2>Créer une complication pour économiser
        des jetons</h2><p>Si votre Éminence a un emplacement de complication
        libre (ou si le Jeu des factions est actif), la zone
        <strong>Complication</strong> propose de créer une complication à la
        place d'une partie de la dépense : décrivez-la et choisissez le nombre
        de jetons économisés (1 à 3), qui devient le nombre de cases barrées.
        Avec le Jeu des factions, la complication peut viser votre Éminence ou
        une faction.</p><h2>Atouts de faction</h2><p>Si le Jeu des factions est
        actif, les atouts collégiaux des relations apparaissent sous vos atouts.
        Le jeton dépensé pour un atout collégial doit venir de la réserve
        collégiale (voir <em>Le jeu des factions</em>).</p><img
        src="systems/penombre/assets/guide/fiche-jet-factions.webp" alt="Fenêtre
        de lancer avec les atouts de faction" /><h2>Si vous lancez une action
        collégiale</h2><p>La première étape est la même que pour une action
        standard, mais le résultat initial n'est affiché dans le tchat qu'une
        fois l'action finalisée.</p><p>Toutes les joueuses connectées, à
        l'exception du MJ, voient dans le message de tchat deux boutons :
        <strong>Participer</strong> et <strong>Ne pas participer</strong>. Une
        joueuse qui participe fait son propre jet ; une joueuse qui ne participe
        pas doit cliquer sur <strong>Ne pas participer</strong> pour que le jet
        collégial aille jusqu'au bout.</p><p>Lorsque toutes les joueuses ont
        fait leur choix, le message initial est mis à jour avec les succès de
        tout le monde. Dans <strong>Autres succès</strong>, une infobulle sur le
        nombre de succès indique le personnage à l'origine du jet. Tous les
        participants peuvent relancer tout ou partie de leurs
        dés.</p><p><strong>Remarque :</strong> le lancer étant visible au moment
        où la joueuse lance les dés, il est conseillé de discuter tous ensemble
        avant que chacune clique sur <strong>Lancer les
        dés</strong>.</p><p><strong>Remarque importante :</strong> pour que le
        système fonctionne correctement, une Éminence grise doit être
        sélectionnée pour chacune des joueuses (<strong>Personnage du
        joueur</strong> dans la configuration du joueur).</p><img
        src="systems/penombre/assets/guide/selection_personnage_joueur.webp"
        alt="Configuration du joueur : personnage du joueur"
        /><h2>Relance</h2><p>Chaque jet peut être relancé plusieurs fois, chaque
        relance coûtant un jeton. Les boutons de relance du message de tchat
        dépendent de l'état des réserves (vides ou non). Sélectionnez les dés à
        relancer et cliquez sur un bouton <strong>Relance (…)</strong> : le
        message initial est mis à jour avec le nouveau résultat et la réserve
        sollicitée est mise à jour automatiquement. Sans dé sélectionné, le
        bouton n'a aucun effet.</p><h2>Créer un raccourci dans la barre des
        raccourcis</h2><p>Glissez-déposez le dé d'harmonique dans la barre des
        raccourcis pour créer un raccourci vers ce jet. L'image du raccourci est
        la valeur du dé.</p>
