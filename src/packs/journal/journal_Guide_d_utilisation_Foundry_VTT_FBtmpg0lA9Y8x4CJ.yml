  - sort: 20000
    name: Paramètres du système
    type: text
    _id: bkfTETg2uFTXRoc3
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <img src="systems/penombre/assets/guide/parametres-systeme.webp"
        alt="Paramètres du système Pénombre" /><h2>Accéder aux
        paramètres</h2><p>Cliquez sur l'icône <strong>Paramètres</strong> (roues
        dentées) de la barre latérale, puis sur <strong>Configurer les
        paramètres</strong>, et choisissez la catégorie
        <strong>Pénombre</strong>.</p><h2>Paramètres du monde
        (MJ)</h2><ul><li><p><strong>Style de jeu</strong> : Kit de démo,
        Standard ou Règles avancées. Les styles Standard et Règles avancées ont
        été débloqués lors d'un palier de financement du jeu sur Game On
        Tabletop ; ils rendent modifiables la Clé, la Gamme et le Ton de la
        fiche d'Éminence grise. Le changement demande un
        rechargement.</p></li><li><p><strong>Nombre de jetons de la Réserve
        collégiale</strong> : 10 par défaut. Dans le style Kit de démo, il doit
        rester à 10.</p></li><li><p><strong>Activer le Jeu des factions</strong>
        : règle optionnelle des relations avec les factions (voir la page <em>Le
        jeu des factions</em>). Indisponible dans le style Kit de
        démo.</p></li></ul><h2>Paramètres de chaque
        joueuse</h2><ul><li><p><strong>Afficher le rappel des règles sur la
        fiche</strong> : affiche ou masque le rappel des dépenses de jetons et
        du tableau des résultats en bas de la fiche d'Éminence grise. Ce réglage
        est propre à chaque joueuse ; le rappel reste accessible depuis le menu
        Pénombre de la barre latérale.</p></li><li><p><strong>Activer les dés
        Pénombre</strong> et <strong>Activer les textures des dés
        Pénombre</strong> : voir la page <em>Comment activer les dés
        Pénombre</em>. Ces deux réglages sont propres à chaque
        poste.</p></li></ul>
