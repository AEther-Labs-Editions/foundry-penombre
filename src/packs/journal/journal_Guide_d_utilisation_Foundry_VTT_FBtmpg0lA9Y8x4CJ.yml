  - sort: 30000
    name: Comment utiliser la fiche d'Éminence grise
    type: text
    _id: Lvwsq6UuIDwfw4qS
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Le MJ (Psycholune) peut vous fournir l'un des prétirés du kit
        (compendium <em>Kit - Prétirés</em>) ou vous laisser créer votre
        Éminence grise.</p><img
        src="systems/penombre/assets/guide/fiche_mode_jouer.webp" alt="Fiche
        d'Éminence grise en mode Jouer" /><h2>Présentation</h2><p>La fiche
        reprend la fiche papier du livre
        :</p><ul><li><p><strong>Personnage</strong> : portrait, nom,
        description, peuple, clé, gamme et
        ton.</p></li><li><p><strong>Harmoniques</strong> : les cinq dés (Nuit,
        Âme, Nature, Esprit, Étincelle). Survolez un dé pour connaître le type
        d'action qu'il couvre ; cliquez dessus pour lancer les
        dés.</p></li><li><p><strong>Conscience</strong> : jetons disponibles,
        valeur actuelle et maximum, jetons,
        complications.</p></li><li><p><strong>Timbre</strong> : partition (case
        de clé et quatre notes), statut Harmonieux, Faux ou Dissonant,
        Peste.</p></li><li><p><strong>Pouvoirs</strong>, <strong>Atouts</strong>
        et <strong>Maîtrises magiques</strong>, chacun avec son
        potentiel.</p></li><li><p><strong>Rappel des règles</strong> en bas, si
        vous l'avez activé dans les
        paramètres.</p></li></ul><h2>Infobulles</h2><p>Survolez le nom d'un
        pouvoir pour afficher son type, sa citation et son effet ; survolez le
        nom d'une maîtrise magique pour afficher son harmonique et sa fiche
        complète (prérequis, action magique, effets par niveau, incident
        magique). Survolez la case d'un pouvoir pour savoir s'il est utilisé,
        les cubes d'un atout pour sa valeur, le niveau d'une maîtrise pour son
        niveau.</p><img
        src="systems/penombre/assets/guide/infobulle-pouvoir.webp"
        alt="Infobulle d'un pouvoir" /><img
        src="systems/penombre/assets/guide/infobulle-maitrise.webp"
        alt="Infobulle d'une maîtrise magique" /><h2>Mode Éditer / Mode
        Jouer</h2><p>Il existe deux modes pour la fiche, sélectionnables grâce à
        l'interrupteur en haut à gauche : le Mode Jouer (figure ci-dessus) et le
        Mode Éditer (figure ci-dessous).</p><img
        src="systems/penombre/assets/guide/fiche_mode_editer.webp" alt="Fiche
        d'Éminence grise en mode Éditer" /><h2>Modifier le personnage</h2><p>En
        Mode Éditer, le nom, la description, le peuple, la clé, la gamme et le
        ton deviennent modifiables (clé, gamme et ton dans les styles Standard
        et Règles avancées). Changer de peuple remet la gamme et le ton par
        défaut de ce peuple. Clic sur le portrait pour le changer, clic droit
        pour revenir à l'image par défaut.</p><h2>Modifier les jetons de
        conscience</h2><p>Les jetons de conscience peuvent être modifiés aussi
        bien en Mode Jouer qu'en Mode Éditer :</p><ul><li><p>clic pour dépenser
        ou réactiver un jeton ;</p></li><li><p>clic droit pour perdre ou ajouter
        un jeton.</p></li></ul><p>La modification du maximum de conscience ne
        s'effectue qu'en Mode Éditer.</p><p><strong>Attention :</strong> les
        jetons de conscience sont aussi modifiés automatiquement par la fenêtre
        de lancer de dés.</p><h2>Ajouter/modifier des complications</h2><p>Les
        ajouts et modifications de complications se font en Mode Éditer ;
        cliquez sur les cases pour fixer leur niveau. Une complication peut
        aussi être créée pendant un jet de dés pour économiser des jetons (voir
        <em>Comment lancer les dés</em>).</p><h2>Ajouter/modifier/supprimer un
        pouvoir, un atout ou une maîtrise magique</h2><p>Les ajouts et
        modifications d'objets se font en Mode Éditer :</p><ul><li><p>clic sur
        l'icône <strong>+</strong>, à droite du titre de la section, pour
        ajouter un objet ;</p></li><li><p>clic sur l'icône
        <strong>Modifier</strong> (crayon dans un carré) pour le modifier
        ;</p></li><li><p>clic sur l'icône <strong>Supprimer</strong> (corbeille)
        pour le supprimer. Attention, cette suppression est immédiate et
        définitive.</p></li></ul><p>Vous pouvez aussi glisser-déposer des objets
        vers et depuis votre fiche, par exemple depuis les compendiums
        <em>Pouvoirs</em> et <em>Maîtrises magiques</em>.</p><h2>Lorsque vous
        modifiez un objet</h2><p>Une fenêtre d'édition apparaît. Un pouvoir a un
        type (peuple, clé, gamme, ton, naissance), une citation et une
        description ; une maîtrise magique a une harmonique, un prérequis, un
        niveau et une description présentée comme les cartes des tirés à
        part.</p><img src="systems/penombre/assets/guide/fiche_edit_item.webp"
        alt="Fenêtre d'édition d'un pouvoir" /><img
        src="systems/penombre/assets/guide/fiche-maitrise.webp" alt="Fenêtre
        d'édition d'une maîtrise magique" /><p><strong>Attention :</strong> dans
        les descriptions, n'appliquez pas d'autres polices que celles des titres
        proposés par l'éditeur, et ne supprimez pas la mise en forme des
        descriptions de maîtrises : cela peut casser l'affichage de la
        fiche.</p><h2>Raccourcis</h2><p>Vous pouvez glisser-déposer votre
        Éminence grise dans la barre des raccourcis pour créer un raccourci qui
        ouvre sa fiche, et un dé d'harmonique pour créer un raccourci vers ce
        jet (voir <em>Comment lancer les dés</em>).</p>
