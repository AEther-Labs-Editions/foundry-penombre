  - sort: 110000
    name: Comment activer les dés Pénombre
    type: text
    _id: 27RpfrSG5BnfW6P1
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Activer Dice So Nice!</h2><p>Les dés virtuels Pénombre ne sont
        visibles que si le MJ a chargé et activé le module <em>Dice So
        Nice!</em> dans le monde.</p><h2>Activer/Désactiver les dés virtuels
        dans les préférences système</h2><p>Vous pouvez à tout moment désactiver
        (ou réactiver) cette fonction dans les préférences du système. Le
        réglage de ces préférences s'effectuera au niveau de chaque client
        (utilisateur) et non pas au niveau du monde (tous les utilisateurs).</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
