  - sort: 90000
    name: La fiche d'Adversaire
    type: text
    _id: g61gWmQtyZJ0gHSi
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Les adversaires sont gérés par le MJ. Leur fiche présente le
        portrait, le nom et la description, l'<strong>Adversité</strong> et la
        <strong>Résilience</strong> (valeur actuelle et maximum), puis leurs
        <strong>Actions adverses</strong> et leurs
        <strong>Intrigues</strong>.</p><img
        src="systems/penombre/assets/guide/fiche-adversaire.webp" alt="Fiche
        d'Adversaire" /><p>Comme la fiche d'Éminence grise, elle a un Mode Jouer
        et un Mode Éditer ; les actions et intrigues s'ajoutent, se modifient et
        se suppriment en Mode Éditer. Les adversaires du kit et des scénarios se
        trouvent dans les compendiums correspondants.</p>
