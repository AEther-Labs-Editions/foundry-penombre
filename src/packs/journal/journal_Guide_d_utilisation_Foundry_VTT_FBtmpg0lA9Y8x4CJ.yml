  - sort: 50000
    name: Comment gérer la réserve collégiale
    type: text
    _id: xiY0OhRbvnWPbRWb
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <img src="systems/penombre/assets/guide/fiche_reserve_collegiale.webp"
        alt="Réserve collégiale" /><h2>Réserve gérée par l'ensemble des
        joueuses</h2><p>Cette réserve est commune à l'ensemble des joueuses : ce
        que vous y faites est répercuté chez les autres joueuses, et
        inversement.</p><h2>Ouvrir la réserve collégiale</h2><p>Depuis le menu
        Pénombre de la barre latérale (bouton <strong>Réserve
        collégiale</strong>), ou avec la macro <strong>Réserve
        collégiale</strong> du compendium Macros, à partager avec vos
        joueuses.</p><h2>Modifier les jetons de la réserve
        collégiale</h2><p>Clic pour dépenser ou réactiver un
        jeton.</p><p><strong>Attention :</strong> les jetons de la réserve
        collégiale sont aussi modifiés automatiquement par la fenêtre de lancer
        de dés.</p><p>Avec un nombre de jetons différent de 10 (styles Standard
        et Règles avancées), les jetons sont affichés en grille plutôt que dans
        le panier ; la fenêtre peut alors être redimensionnée.</p><h2>Feuille
        collégiale étendue</h2><p>Si le Jeu des factions est actif, la fenêtre
        devient la feuille collégiale étendue du livre, avec le potentiel
        collégial et les relations : voir la page <em>Le jeu des
        factions</em>.</p>
