  - sort: 60000
    name: Le jeu des factions
    type: text
    _id: f11CyHI4qkPNGiFt
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Le jeu des factions est une règle optionnelle du livre (chapitre
        <em>La lutte au quotidien</em>, p. 90 à 94) : les Éminences grises
        entretiennent, en tant que groupe, des relations avec des factions, sous
        forme d'atouts et de complications collégiaux. Le MJ l'active dans les
        paramètres du système (<strong>Activer le Jeu des factions</strong>),
        sauf dans le style Kit de démo.</p><h2>La feuille collégiale
        étendue</h2><p>La fenêtre de la réserve collégiale reproduit alors la
        feuille collégiale étendue du livre :</p><ul><li><p>la <strong>réserve
        collégiale</strong>, comme d'habitude ;</p></li><li><p>le médaillon
        <strong>Potentiel</strong> : les points de potentiel collégial servant à
        créer des atouts collégiaux en cours de partie ;</p></li><li><p>la
        colonne <strong>Relations</strong> : pour chaque faction, jusqu'à trois
        atouts collégiaux (niveau 1 à 3) et une complication collégiale (trois
        cases).</p></li></ul><img
        src="systems/penombre/assets/guide/feuille-collegiale-etendue.webp"
        alt="Feuille collégiale étendue" /><p>La fenêtre peut être agrandie en
        hauteur pour afficher plus de relations.</p><h2>Gérer les relations
        (MJ)</h2><p>Le MJ passe la fenêtre en mode édition avec l'interrupteur
        en haut à gauche ; les joueuses voient la feuille en lecture
        seule.</p><img
        src="systems/penombre/assets/guide/feuille-collegiale-edition.webp"
        alt="Feuille collégiale étendue en mode édition"
        /><ul><li><p><strong>Nouvelle relation</strong>, en bas de la colonne,
        crée une faction ; son nom se saisit sur la ligne <em>Nom de la
        relation</em>.</p></li><li><p>Écrire sur une ligne d'atout ou de
        complication vide crée l'atout (niveau 1) ou la complication (une case
        barrée).</p></li><li><p>Cliquez sur les cubes ou les cases pour changer
        un niveau ; cliquer sur la dernière case barrée la décoche. Une
        complication sans case barrée reste affichée jusqu'à ce que le MJ la
        retire (elle disparaît à la retraite suivante).</p></li><li><p>La croix
        au survol d'une ligne supprime l'élément ; pour un atout perdu pour des
        raisons narratives, une case permet de remettre ses points dans le
        potentiel collégial.</p></li><li><p>Créer un atout ne dépense rien : le
        MJ reporte lui-même le coût éventuel (point de potentiel, case de
        complication pour obtenir le niveau 2), ce qui couvre la création
        préalable, l'évolution de fin de scénario et les dépenses de potentiel
        en jeu.</p></li></ul><h2>En jeu</h2><ul><li><p>Les <strong>atouts de
        faction</strong> apparaissent dans la fenêtre de lancer, sous les atouts
        de l'Éminence. Comme tout atout, ils ajoutent autant de D6 que leur
        niveau et coûtent un jeton s'ils ne sont pas le premier atout ; ce jeton
        doit venir de la <strong>réserve collégiale</strong>.</p></li><li><p>Sur
        une <strong>fausse note</strong>, l'un des atouts collégiaux utilisés
        perd un niveau (au choix si plusieurs) ; à 0, il est
        effacé.</p></li><li><p>Une <strong>complication collégiale</strong> peut
        être créée pendant un jet à la place de jetons, en choisissant la
        faction comme cible ; le MJ peut aussi en imposer une en mode
        édition.</p></li><li><p>Mobiliser une faction pour agir à la place des
        Éminences coûte un jeton collégial et, si c'est pertinent, un jet de
        dés.</p></li></ul>
