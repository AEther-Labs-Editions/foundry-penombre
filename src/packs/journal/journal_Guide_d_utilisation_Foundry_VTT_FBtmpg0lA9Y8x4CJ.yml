  - sort: 80000
    name: Le gestionnaire de groupe
    type: text
    _id: IQfG68viGvAKGoR7
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Réservé au MJ, le gestionnaire de groupe affiche les Éminences grises
        des joueuses connectées : nom de la joueuse et de son personnage, dés
        des cinq harmoniques et jetons de conscience. Il s'ouvre depuis le menu
        Pénombre de la barre latérale ou avec la macro <strong>Gestionnaire de
        groupe</strong>.</p><img
        src="systems/penombre/assets/guide/gestionnaire-groupe.webp"
        alt="Gestionnaire de groupe" /><p>Seules les joueuses connectées ayant
        une Éminence grise assignée (<strong>Personnage du joueur</strong>) y
        apparaissent.</p>
