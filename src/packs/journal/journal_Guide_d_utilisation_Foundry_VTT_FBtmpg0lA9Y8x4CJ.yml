  - sort: 100000
    name: Comment gérer les combats
    type: text
    _id: P27arfJEB6MZewCH
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Ce qui perdure</h2><p>Pour gérer les combats, placez comme à
        l'habitude les acteurs dans le <strong>Combat
        Tracker</strong>.</p><h2>Ce qui change</h2><ul><li><p>Gestion de
        l'initiative par drag'n'drop : vous pouvez à tout moment réorganiser
        l'ordre de combat par glisser-déposer dans le <strong>Combat
        Tracker</strong>.</p></li><li><p>Le système a supprimé l'affichage de
        l'initiative (inutile dans <em>Pénombre</em>).</p></li><li><p>Le système
        a supprimé les boutons de relance de l'initiative (inutiles dans
        <em>Pénombre</em>).</p></li><li><p>Au démarrage du combat, les Éminences
        sont placées automatiquement avant les adversaires, comme le suggèrent
        les règles.</p><img
        src="systems/penombre/assets/guide/combat_tracker.webp" /></li></ul>
    video:
