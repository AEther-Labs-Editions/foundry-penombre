  - sort: 120000
    name: Les compendiums
    type: text
    _id: Nw4g5kju0q2PA2WR
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Le système fournit plusieurs compendiums, à glisser-déposer vers les
        fiches ou dans le monde :</p><ul><li><p><strong>Pouvoirs</strong> : les
        127 pouvoirs du livre, classés par peuple, clé, gamme et ton, avec leur
        citation.</p></li><li><p><strong>Maîtrises magiques</strong> : les douze
        maîtrises, présentées comme les cartes des tirés à part (prérequis,
        harmonique, action magique, effets par niveau, incident
        magique).</p></li><li><p><strong>Kit - Prétirés</strong>, <strong>Kit -
        Pouvoirs potentiels</strong> et <strong>Kit - Adversaires</strong> : les
        Éminences grises prêtes à jouer du kit de démo, les pouvoirs qu'elles
        peuvent acquérir et les adversaires du kit.</p></li><li><p>Les
        compendiums des scénarios <strong>Plénitude</strong> et
        <strong>Échos</strong> (adversaires et journaux), <strong>Images &amp;
        Scènes</strong>.</p></li><li><p><strong>Journaux</strong> : ce guide,
        l'<strong>Écran</strong> (image de l'écran et de ses quatre volets) et
        le lexique.</p></li><li><p><strong>Macros</strong> : Réserve collégiale,
        Gestionnaire de groupe, Afficher la carte de
        l'Harmonde.</p></li></ul><p><strong>Remarque :</strong> les acteurs et
        objets déjà importés dans un monde ne sont pas mis à jour quand les
        compendiums évoluent ; réimportez-les depuis le compendium pour profiter
        des textes à jour.</p>
