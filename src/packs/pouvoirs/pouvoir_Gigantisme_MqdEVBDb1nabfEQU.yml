  citation: On n'est jamais si grand que quand on se sent libre. Ou l'inverse.
  description: >-
    <p>Aussi longtemps qu'il le souhaite, votre géant abandonne sa taille
    réfrénée et reprend sa taille naturelle. Les objets de taille standard sont
    inutilisables sous cette forme. Jusqu'au prochain coucher de soleil, le
    nombre de succès de toutes ses actions d'étincelle et de nature augmente de
    2, mais celui de toutes ses actions d'esprit et de nuit diminue de 1. Tout
    cela cesse immédiatement si votre géant décide de réfréner sa taille à
    nouveau (action automatique).</p>
