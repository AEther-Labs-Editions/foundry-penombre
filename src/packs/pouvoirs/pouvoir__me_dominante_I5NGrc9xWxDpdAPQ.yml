  citation: Ma conscience s'ébroue et se répand, à tâtons puis de plus en plus vite.
  description: >-
    <p>Votre âme accouchée prend le contrôle, aussi longtemps qu'elle le
    souhaite, d'un autre personnage consentant ou épuisé qui lui est proche. Par
    la suite, elle le contrôle tant qu'il se trouve proche, et la coercition
    peut être relâchée sans rompre le lien. Chaque lien avec un nouveau
    personnage diminue de 1 la valeur de conscience maximale de votre âme
    accouchée, ce qui peut la troubler, l'épuiser, voire la tuer. Rompre un lien
    est une action automatique qui ne restaure pas la valeur de conscience
    maximale.</p>
