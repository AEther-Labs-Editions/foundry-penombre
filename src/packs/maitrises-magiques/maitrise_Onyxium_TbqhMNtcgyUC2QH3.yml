type: maitrise
name: Onyxium
img: systems/penombre/assets/magies/magie_onyxium.webp
system:
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un artiste de l’onyxium doit…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Prérequis</span>
    <strong>onyxer.</strong> Il inocule à une cible, ou s’inocule à lui-même de
    l’onyx contenu dans un objet consommable, ou une boulette de drogue
    noire.</p><p class="maitrise-intro">Cette action le fait entrer en résonance
    avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">nuit</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>confère à l’onyxé
    des capacités démoniaques,</strong> ou les moyens de générer une émanation
    soudaine d’onyx qui pollue et modifie l’environnement et les
    organismes.</p><p class="maitrise-intro">Avec un effet magique de niveau
    <span class="maitrise-pastille">?</span> …<br>il parvient par exemple
    à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique d’art noir (conjuration, onyxium, prisme) ; répandre une nappe
    d’onyx effrayante ; détecter l’onyx, la porte noire ou le conjurateur le
    plus proche ; voir dans le noir, développer des sens, une force, une
    souplesse ou une prestance démoniaque ;
    etc.</p></li><li><p><strong><em>espionner</em></strong> les Abysses, un
    démon connu ou un haut diable ; créer une zone d’ombre ; épier depuis une
    ombre comme s’il s’y trouvait ; imprégner une zone d’onyx qui englue et
    entrave ceux qui la parcourent ; parler d’égal à égal avec un démon ;
    etc.</p></li><li><p><strong><em>obliger</em></strong> un démon à une action,
    ou une mission ; utiliser les ombres comme des portails pour se déplacer ;
    acquérir un appendice démoniaque temporaire (griffes, ailes, queue
    préhensile, etc.) ; projeter de l’onyx sous forme de flèches ou de crachats
    ; commander à une ombre de manipuler un objet, ou attaquer ;
    etc.</p></li><li><p><strong><em>provoquer</em></strong> une crise de folie
    ou de paranoïa ; animer son ombre comme un double, et la commander ;
    transmuter une matière en onyx, ou en ombre ; prendre le contrôle mental
    d’un démon ; etc.</p></li><li><p><strong><em>devenir</em></strong>
    définitivement un démon ou un horla ; provoquer une immense marée d’onyx
    corrosive ; ouvrir une nouvelle porte noire ; etc.</p></li></ol><p
    class="maitrise-intro">Mais attention, il risque également de…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Incident
    magique</span> <strong>souffrir du mal des Abysses.</strong> L’onyxium
    provoque chez l’onyxé, à chaque incident magique, l’apparition d’une
    complication de niveau 3 : une crise de manque, un vertige, la sensation de
    devenir un démon ou un haut diable. L’onyxé peut par ailleurs être envahi de
    pensées démoniaques parasites, ou voir apparaître sur son corps un stigmate
    abyssal. Cette addiction peut aussi le pousser à tout négliger pour trouver
    une nouvelle dose.</p></div>
