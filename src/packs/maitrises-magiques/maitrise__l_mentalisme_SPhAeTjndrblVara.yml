type: maitrise
name: Élémentalisme
img: systems/penombre/assets/magies/magie_elementalisme.webp
system:
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un élémentaliste doit…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Prérequis</span> <strong>faire naître des
    éléments présents dans le décor, ou libérer de son contenant, une créature
    élémentaire</strong> primitive nommée élémentä – un homoncule fortement
    teinté par son matériau d’origine.</p><p class="maitrise-intro">Cette action
    le fait entrer en résonance avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">nature</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> utilise l’élémentä en
    l’effritant, le dispersant, le façonnant ou le consommant comme une drogue
    afin d’en tirer des informations, archiver des connaissances cryptées,
    s’approprier son énergie élémentaire ou la projeter magiquement.</p><p
    class="maitrise-intro">Avec un effet magique de niveau <span
    class="maitrise-pastille">?</span> …<br>il parvient par exemple à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique de magie naturelle (brigue, élémentalisme, magie des saisons)
    ; ressentir l’émotion de la matière ; confier à la matière un mot à répéter
    ; faire se déplacer une pierre ; améliorer n’importe quelle capacité
    physique ou mentale ; etc.</p></li><li><p><strong><em>obtenir des
    informations</em></strong> grossières mémorisées par la matière ; confier à
    la matière un long message à répéter ; transmuter une matière en une autre
    sans en changer l’état liquide, solide, ou gazeux (affûter ou émousser une
    lame, souder deux métaux, rendre l’air irrespirable, changer l’eau en
    alcool, etc.) ; contrôler les mouvements d’un feu, de l’eau, du vent, ou
    provoquer un soubresaut tellurique ; devenir brûlant, ou glacé ;
    etc.</p></li><li><p><strong><em>obtenir des informations</em></strong>
    précises mémorisées par la matière ; envoyer un messager élémentaire parler
    à un personnage ; se rendre insensible à un élément, ou utiliser un élément
    comme protection ; remodeler et façonner la matière, modifier sa forme, son
    état et sa densité (liquéfier un rocher, s’armer d’une lame de feu, animer
    une statue, etc.) ; etc.</p></li><li><p><strong><em>se
    dissimuler</em></strong> dans un élément, ou voyager au travers ; accomplir
    des prouesses physiques impossibles ; augmenter ou diminuer la quantité d’un
    matériau ; transmuter temporairement son corps en feu, en eau ;
    etc.</p></li><li><p><strong><em>coder</em></strong> un livre entier dans une
    flamme ou une goutte d’eau ; transmuter entièrement un élément en un autre
    (l’eau en feu, etc.) ; changer définitivement un mortel en golem
    élémentaire, ou inversement ; etc.</p></li></ol><p
    class="maitrise-intro">Mais attention, il risque également de…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Incident
    magique</span> <strong>se brûler les ailes.</strong> Il note une
    complication de niveau 3 correspondant à un épuisement physique ou mental,
    une grave brûlure, un étouffement, une déshydratation sévère, etc.</p><p
    class="maitrise-intro">OU</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Incident magique</span> <strong>se laisser
    submerger.</strong> L’élémentä se retourne contre lui, à moins que des
    scories s’incarnent dans un esprit frappeur. La créature est un opposant de
    difficulté égale au nombre de succès obtenus sur l’action de maîtrise
    magique.</p></div>
  harmonique: nature
  niveau: 1
  prerequis: >-
    faire naître des éléments présents dans le décor, ou libérer de son
    contenant, une créature élémentaire
