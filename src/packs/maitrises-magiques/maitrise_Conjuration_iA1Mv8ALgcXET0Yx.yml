name: Conjuration
img: systems/penombre/assets/magies/magie_conjuration.webp
system:
  slug: ''
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un conjurateur doit…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Prérequis</span> <strong>tracer les contours
    d’une ombre</strong> à l’aide d’un pinceau et d’une encre de conjuration
    (officielle ou frelatée).</p><p class="maitrise-intro">Cette action le fait
    entrer en résonance avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">nuit</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>pactise avec le
    démon né de cette ombre.</strong> Le démon exécute la mission qui lui est
    confiée, et le conjurateur le rémunère. La connivence qui les unit doit être
    enregistrée auprès d’un advocatus diaboli et coûte d’autant plus cher que
    l’effet souhaité est élevé.</p><p class="maitrise-intro">Avec un effet
    magique de niveau <span class="maitrise-pastille">?</span> …<br>il conjure
    un démon capable par exemple de…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique d’art noir (conjuration, onyxium, prisme) ; chercher un objet
    ; transporter une charge ou un message, y compris en volant ; faire une
    bêtise, ou divertir ; faire peur ; mordre, griffer, piétiner ; servir de
    réveil chaque matin ; donner une propriété nouvelle à un objet ;
    etc.</p></li><li><p><strong><em>mener</em></strong> une enquête sommaire ;
    servir d’escorte ou de garde ; se faire discret, se camoufler et épier ;
    utiliser une arme ou un objet sophistiqué ;
    etc.</p></li><li><p><strong><em>filer</em></strong> un suspect ; comprendre
    des indices ; servir de partenaire lors d’une réception mondaine ; pratiquer
    un art ; partager des connaissances sur un sujet précis ; se battre comme un
    soldat ; etc.</p></li><li><p><strong><em>mener</em></strong> une troupe ;
    échafauder un complot ; séduire ; pratiquer une maîtrise magique, sauf la
    conjuration ; disposer d’un savoir unique ; usurper une identité ; se battre
    comme un duelliste renommé ;
    etc.</p></li><li><p><strong><em>exceller</em></strong> dans tous les
    domaines ; conjurer de nouveaux démons ; etc.</p></li></ol><p
    class="maitrise-intro">Mais attention, il risque également de…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Incident
    magique</span> <strong>laisser la porte ouverte.</strong> L’ombre laisse
    s’échapper bien plus que le démon appelé. Cela peut valoir au conjurateur
    une sanction de la part du Clergé obscur. Qui a fui ?</p><p
    class="maitrise-note"><strong><em>NOTE :</em></strong> <em>Dans le tableau
    de difficultés des effets magiques (voir p. 26), les paramètres « cible » et
    « distance » font référence à la cible désignée au démon pour sa mission.
    Par exemple, le démon doit agir sur un individu, un groupe, ou une foule, ou
    infiltrer un bâtiment qui peut être proche, ou lointain.</em></p></div>
  harmonique: nuit
  niveau: 1
  prerequis: tracer les contours d’une ombre
