type: maitrise
name: Prisme
img: systems/penombre/assets/magies/magie_prisme.webp
system:
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un artiste du prisme doit…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Prérequis</span>
    <strong>travailler la lumière,</strong> surligner une ligne de contraste à
    la craie, placer des bougies rituelles aux bons emplacements pour créer des
    ombres portées, ou diffracter des rayons à l’aide d’un ustensile prismatique
    (loupe, lunettes, vitricle, cristal, etc.).</p><p
    class="maitrise-intro">Cette action le fait entrer en résonance avec…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Harmonique :</span>
    <span class="maitrise-harmonique">nuit</span></p><p
    class="maitrise-intro">Ce faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>voit
    apparaître</strong> sous ses yeux des indices et des détails, des odeurs
    colorées, des sons parfumés, des goûts bruyants, des espaces insoupçonnés et
    des traverses intimes.</p><p class="maitrise-intro">Avec un effet magique de
    niveau <span class="maitrise-pastille">?</span> …<br>il parvient par exemple
    à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique d’art noir (conjuration, onyxium, prisme) ; éblouir ou
    aveugler un personnage ; suivre la trace d’un personnage dont il connaît la
    trace colorée unique ; savoir l’allégeance d’un démon ; faire apparaître un
    indice aux yeux de tous ; découvrir ou récolter la couleur unique d’un
    individu ; etc.</p></li><li><p><strong><em>brouiller</em></strong> l’image
    d’un personnage ou d’un objet ; comparer et différencier des couleurs très
    proches ; décomposer les ingrédients d’un son, ou d’un goût ; fabriquer des
    pigments durables pouvant servir à des artisans ; franchir un passage trop
    petit ; concentrer la lumière en un rayon d’énergie ;
    etc.</p></li><li><p><strong><em>créer</em></strong> un mirage dédoublant un
    objet, ou un personnage capable d’agir ; changer la façon dont fonctionnent
    les sens (voir la chaleur corporelle, entendre les odeurs, etc.) ; écrire un
    message lisible uniquement par d’autres artistes du prisme, ou totalement
    ineffaçable (comme s’il était projeté par le soleil) ;
    etc.</p></li><li><p><strong><em>altérer</em></strong> les sens de tous pour
    que le moindre détail devienne immense, transformant une rue pavée en
    labyrinthe ; perturber les sens au point de provoquer une crise de folie ;
    passer d’un espace à un autre en suivant un rayon de lumière, quelle que
    soit la taille du passage ; ouvrir une poche de réalité augmentée ;
    retrouver un personnage par les traces colorées qu’il laisse, même sans le
    connaître ; etc.</p></li><li><p><strong><em>voyager</em></strong> par la
    lumière sur de longues distances ; atteindre un méandre, une étoile dans le
    ciel, l’intérieur d’un esprit mortel ; franchir une ombre pour rejoindre les
    Abysses, les Cornes, ou le fonctionnaire du Clergé obscur le plus proche
    (advocatus diaboli chargé des relations entre démons et mortels) ; récolter
    la couleur d’un personnage, et donc son âme pour ainsi le tuer ;
    etc.</p></li></ol><p class="maitrise-intro">Mais attention, il risque
    également de…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Incident magique</span> <strong>trouver un diable
    dans les détails.</strong> Parfois, le monde de l’artiste prismatique se
    distend autour de lui, devient fractal et impressionniste, ou s’étire en
    créatures obscènes. Un « gardien » sans visage apparaît ; l’artiste du
    prisme est aveuglé par la débauche de détails qui l’entourent, ses sens
    saturés devenant ininterprétables ; etc.</p></div>
  harmonique: nuit
  niveau: 1
  prerequis: travailler la lumière
