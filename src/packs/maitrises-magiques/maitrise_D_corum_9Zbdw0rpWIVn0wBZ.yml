type: maitrise
name: Décorum
img: systems/penombre/assets/magies/magie_decorum.webp
system:
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un harmoniste du décorum<br>doit…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Prérequis</span>
    <strong>réaliser une esquisse,</strong> un croquis, un tableau, voire une
    fresque picturale.</p><p class="maitrise-intro">Cette action le fait entrer
    en résonance avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">âme</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>redessine la
    réalité</strong> comme s’il corrigeait l’œuvre maladroite d’un artiste
    débutant. L’Harmonde inanimé se recompose sous son trait.</p><p
    class="maitrise-intro">Avec un effet magique de niveau <span
    class="maitrise-pastille">?</span> …<br>il parvient par exemple à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique d’art ancien (accord, décorum, geste) ; ajouter ou gommer un
    détail sur un objet ; embellir ou enlaidir sans dénaturer ;
    etc.</p></li><li><p><strong><em>remplacer</em></strong> une couleur par une
    autre ; rendre un objet méconnaissable ; créer le temps d’une scène un
    mirage ou une illusion réaliste, mais immatérielle ; modifier une
    perspective pour agrandir, réduire, approcher ou éloigner ;
    etc.</p></li><li><p><strong><em>créer ou effacer</em></strong>
    temporairement un élément de décor ; déplacer définitivement un élément
    existant ; rendre translucide ; détruire, abîmer ou réparer un élément de
    décor ; créer un point faible ; etc.</p></li><li><p><strong><em>créer ou
    effacer</em></strong> définitivement un élément de décor ; rendre
    temporairement un objet invisible ;
    etc.</p></li><li><p><strong><em>créer</em></strong> un tableau-monde
    connecté à l’Harmonde ; ouvrir un portail entre deux lieux ;
    etc.</p></li></ol><p class="maitrise-intro">Mais attention, il risque
    également de…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Incident magique</span> <strong>voir son œuvre
    lui échapper.</strong> En prenant l’Harmonde pour toile, l’artiste doit
    s’attendre à le voir réagir. L’artiste se retrouve prisonnier d’un méandre ;
    plusieurs réalités se superposent autour de lui, ou pire, en lui ; son
    environnement se transforme d’une manière imprévisible ; sa maladresse
    suscite la colère des témoins alentour, ou de l’Harmonde lui-même qui
    déchaîne les éléments contre lui ; etc.</p></div>
