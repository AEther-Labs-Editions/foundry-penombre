type: maitrise
name: Obscurantisme
img: systems/penombre/assets/magies/magie_obscuranstisme.webp
system:
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un obscurantiste doit…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Prérequis</span> <strong>torturer,</strong>
    physiquement ou mentalement, son danseur asservi en s’aidant de lanières
    cloutées, de chaînes, de cages et d’étaux (chaque obscurantiste développe
    son style).</p><p class="maitrise-intro">Cette action le fait entrer en
    résonance avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">étincelle</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>fait produire à son
    danseur asservi des étincelles</strong> bleu nuit, rouges ou noires,
    vectrices d’une magie cauchemardesque et destructrice.</p><p
    class="maitrise-intro">Avec un effet magique de niveau <span
    class="maitrise-pastille">?</span> …<br>il parvient par exemple à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique cryptogrammique (éclipsisme, jornisme, obscurantisme) ;
    projeter des traits de feu, d’acide, ou d’onyx ; aveugler, rendre sourd ou
    muet en oblitérant l’organe concerné le temps d’une scène ; effrayer ;
    provoquer un spasme, ou une douleur ; créer l’obscurité, ou voir dans les
    ténèbres ; etc.</p></li><li><p><strong><em>amadouer</em></strong> un démon ;
    créer une nuée de vermines ; créer un champ de force ou un bouclier
    ténébreux ; affaiblir ou accroître des capacités physiques ; susciter la
    colère et la haine ; forcer à fuir ;
    etc.</p></li><li><p><strong><em>imposer</em></strong> une action à un démon
    ; créer une illusion cauchemardesque ; tétaniser un danseur ; disparaître et
    réapparaître dans une même ombre, plus tard ; créer un piège d’onyx pour
    entraver ou blesser ; faire attaquer les ombres ; maudire ;
    etc.</p></li><li><p><strong><em>prendre le contrôle mental</em></strong>
    d’un démon ; imposer une action à un mortel ; voyager par les ombres ;
    ravager et briser l’esprit de manière indétectable ; amputer dans une gerbe
    de sang ; etc.</p></li><li><p><strong><em>prendre le contrôle
    mental</em></strong> d’un mortel ; transférer la vie tel un vampire ;
    soulager et guérir dans un hurlement de souffrance ; tuer à coup sûr ;
    etc.</p></li></ol><p class="maitrise-intro">Mais attention, il risque
    également de…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Incident magique</span> <strong>regretter un
    accès de violence.</strong> Cette petite chose est si fragile, et il est si
    facile d’en extraire un petit supplément de puissance… L’obscurantiste
    ressent dans sa chair les sévices qu’il inflige ; un personnage proche est
    pris de douleurs, de nausées, ou s’évanouit ; le danseur développe une
    marque étrange, séquelle des tortures qu’il a subies ; le danseur s’affale,
    inanimé jusqu’au prochain repos ; le danseur meurt, terrifié, exsangue ou
    désarticulé ; etc.</p></div>
