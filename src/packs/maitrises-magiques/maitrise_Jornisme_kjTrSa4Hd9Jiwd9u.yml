system:
  slug: ''
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un jorniste doit…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Prérequis</span> <strong>guider mentalement son
    danseur asservi</strong> pour qu’il accomplisse une danse, ne s’aidant des
    mains que pour l’encourager.</p><p class="maitrise-intro">Cette action le
    fait entrer en résonance avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">étincelle</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> fait produire à son danseur
    des étincelles blanches, nacrées et ambrées adaptées à une magie
    bienveillante et protectrice.</p><p class="maitrise-intro">Avec un effet
    magique de niveau <span class="maitrise-pastille">?</span> …<br>il parvient
    par exemple à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique cryptogrammique (éclipsisme, jornisme, obscurantisme) ;
    appeler, amadouer un animal domestique ; produire de la lumière ; créer une
    ambiance chaleureuse ; résister à la chaleur et au froid ; apporter du
    soutien à une action ; apaiser, réconforter, encourager ;
    etc.</p></li><li><p><strong><em>produire</em></strong> ou purifier de l’eau
    ; créer une barrière de lumière étincelante ; faire réaliser une action
    physique à son danseur, comme s’il était affranchi ; renforcer le corps ;
    guérir dans un halo d’étincelles lumineuses ;
    etc.</p></li><li><p><strong><em>produire</em></strong> ou purifier de la
    nourriture ; discuter avec un animal ; rendre un objet insaisissable, ou
    impossible à voler ; paraître parfaitement sympathique ; discerner la vérité
    ; voir au-delà des apparences ;
    etc.</p></li><li><p><strong><em>ressentir</em></strong> la clé harmonique
    d’un personnage ; créer une illusion idyllique ; améliorer les récoltes ;
    faire pousser une plante, ou discuter avec elle ; empêcher un démon de
    s’approcher, ou faire s’évaporer l’onyx ; commander aux animaux ; régénérer
    un membre ; manipuler par télékinésie ;
    etc.</p></li><li><p><strong><em>frapper</em></strong> d’un trait de lumière
    paralysant ; imposer un silence total ; ramener à la vie un personnage qui
    vient de mourir ; rendre fertile, ou faire tomber enceinte ;
    etc.</p></li></ol><p class="maitrise-intro">Mais attention, il risque
    également de…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Incident magique</span> <strong>provoquer les
    prédateurs – les danseurs en ont plein.</strong> Un chat apparaît et tente
    de dévorer le danseur du jorniste ; un piège se referme sur le danseur du
    jorniste, et un petit chasseur approche pour s’en emparer ; des corbeaux
    veulent enlever le danseur du jorniste ; le mage sent son danseur taraudé
    entre le lien empathique qu’ils partagent et un étrange appel lointain ;
    etc.</p></div>
