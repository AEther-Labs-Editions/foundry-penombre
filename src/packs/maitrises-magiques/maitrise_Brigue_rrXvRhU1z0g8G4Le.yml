name: Brigue
img: systems/penombre/assets/magies/magie_brigue.webp
system:
  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un brigand doit…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Prérequis</span> <strong>fabriquer une « penne »
    animale OU en utiliser une déjà fabriquée</strong>. Il peut s’agir des
    plumes d’une flèche, d’une corde en crins, de lanières de cuir, d’une mouche
    de pêche, d’un grigri en corne ou en dents, etc.</p><p
    class="maitrise-intro">Cette action le fait entrer en résonance avec…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Harmonique :</span>
    <span class="maitrise-harmonique">nature</span></p><p
    class="maitrise-intro">Ce faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>fait corps avec
    l’Harmonde, qui devient pour lui un terrain de jeu</strong> couvert d’agrès
    improvisés : les tas de paille se changent en trampolines ; les branches, en
    barres parallèles ; les lierres, en échelles ; les enseignes, en trapèzes ;
    les animaux, en camarades de jeu ; etc.</p><p class="maitrise-intro">Avec un
    effet magique de niveau <span class="maitrise-pastille">?</span> …<br>il
    parvient par exemple à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique de magie naturelle (brigue, élémentalisme, magie des saisons)
    ; ralentir une glissade ; se rattraper à une aspérité ; appeler, amadouer,
    effrayer une bête sauvage ou en ressentir les émotions ; repérer des traces
    animales, ou un passage naturel ; devenir plus fort, plus souple, plus
    habile ; placer une botte secrète ; trouver un point d’eau ;
    etc.</p></li><li><p><strong><em>amortir</em></strong> une chute libre ;
    escalader comme une araignée ; marcher sur un fil ; parler aux animaux ;
    dévier les coups ou les flèches à mains nues ; tirer une flèche
    rebondissante ou à tête chercheuse ; percevoir à travers les sens d’un
    animal ; etc.</p></li><li><p><strong><em>se déplacer</em></strong> d’un bond
    en un lieu autrement hors de portée ; changer de taille et gagner en
    assurance ; prendre le contrôle mental d’une bête sauvage ;
    etc.</p></li><li><p><strong><em>courir</em></strong> sur les murs, ou l’eau
    ; voyager de cime en cime ; laisser une empreinte (silhouette, ou fil de la
    lame) à peine visible mais qui peut bloquer, ou blesser si on s’y heurte ;
    effrayer un mortel ; prendre le contrôle mental d’une meute entière ;
    adopter la forme d’un animal ; etc.</p></li><li><p><strong><em>voler, ou
    marcher</em></strong> dans le vide ; esquiver sans donner l’impression de
    bouger ; créer une empreinte d’un animal ou d’un personnage (un double
    réalisant ses propres actions indépendantes) ; etc.</p></li></ol><p
    class="maitrise-intro">Mais attention, il risque également de…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Incident
    magique</span> <strong>se prendre le mur.</strong> Les observateurs peuvent
    l’entrevoir comme un champ de force irisé aux motifs impensables qui
    apparaît soudain dans l’air. Quelle est cette limite immuable ?</p><p>Le
    brigand est pris d’un vertige tenace ; le brigand souffre d’une déchirure
    musculaire, ou d’une luxation ; le brigand prend soudain conscience de la
    fragilité de son existence ; etc.</p></div>
