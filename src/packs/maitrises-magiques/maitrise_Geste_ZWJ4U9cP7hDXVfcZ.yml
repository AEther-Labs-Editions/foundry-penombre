  description: >-
    <div class="maitrise-carte"><p class="maitrise-intro">Pour préparer son
    effet magique, un harmoniste de la geste doit…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Prérequis</span>
    <strong>utiliser sa voix</strong> pour crier, déclamer, réciter, murmurer,
    ou marmonner un texte poétique.</p><p class="maitrise-intro">Cette action le
    fait entrer en résonance avec…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Harmonique :</span> <span
    class="maitrise-harmonique">âme</span></p><p class="maitrise-intro">Ce
    faisant, il…</p><p class="maitrise-entree"><span
    class="maitrise-etiquette">Action magique</span> <strong>altère le cours du
    temps.</strong> Il peut, comme avec les flots bouillonnants d’une rivière,
    lire les marques du passé sur ses berges, deviner les remous à venir,
    accélérer ou ralentir son écoulement, faire ricocher un objet à sa surface,
    etc.</p><p class="maitrise-intro">Avec un effet magique de niveau <span
    class="maitrise-pastille">?</span> …<br>il parvient par exemple à…</p><ol
    class="maitrise-niveaux"><li><p><strong><em>identifier</em></strong> un
    effet magique d’art ancien (accord, décorum, geste) ; restaurer ou vieillir
    un objet ; provoquer une érosion accélérée ; exacerber la peur de la mort en
    la montrant ; etc.</p></li><li><p><strong><em>voir le passé ou l’avenir
    proche ;</em></strong> ralentir ou accélérer un mouvement ; faire fluctuer
    le temps autour d’un personnage ; comprendre et parler un dialecte inconnu ;
    soulager la fatigue en faisant oublier au corps le temps qui passe ;
    etc.</p></li><li><p><strong><em>faire apparaître</em></strong> une vision du
    passé proche, ou de l’avenir proche ; voir le passé lointain d’un lieu ou
    d’un objet ; obtenir une information historique précise ; parler avec un
    mort ; formuler une prophétie ; etc.</p></li><li><p><strong><em>figer dans
    le temps ;</em></strong> rajeunir ou faire vieillir le corps d’un personnage
    ; entrevoir une destinée ; nécroser et scléroser la chair ; éviter la mort ;
    invoquer le souvenir d’un personnage du passé et contrôler ses actions ;
    etc.</p></li><li><p><strong><em>dissimuler</em></strong> dans le temps et
    ressurgir au même endroit, plus tard ; se déplacer instantanément vers un
    espace lointain par un repli du temps ; réincarner le passé comme si c’était
    le présent ; avancer ou revenir de quelques instants dans le temps ;
    modifier le temps pour accélérer une guérison ; etc.</p></li></ol><p
    class="maitrise-intro">Mais attention, il risque également de…</p><p
    class="maitrise-entree"><span class="maitrise-etiquette">Incident
    magique</span> <strong>sombrer dans la mélancolie.</strong> À la moindre
    hésitation, l’harmoniste se retrouve emporté par les flots du temps,
    ballotté par les voix muettes de l’Harmonde et écorché par les écueils de
    son destin incertain. L’harmoniste fait des rêves persistants ; l’harmoniste
    est hanté par une présence ou des souvenirs étrangers ; l’harmoniste est
    pris de doute, voire plonge dans une profonde dépression ; etc.</p></div>
