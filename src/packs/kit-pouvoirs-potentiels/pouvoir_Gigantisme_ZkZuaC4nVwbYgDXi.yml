  citation: On n'est jamais si grand que quand on se sent libre. Ou l'inverse.
  description: >-
    <p>Aussi longtemps qu'elle le souhaite, Nuane abandonne sa taille réfrénée
    et reprend sa taille naturelle. Les objets de taille standard sont
    inutilisables sous cette forme. Jusqu'au prochain coucher de soleil, le
    nombre de succès de toutes ses actions d'étincelle et de nature augmente de
    2, mais celui de toutes ses actions d'esprit et de nuit diminue de 1. Tout
    cela cesse immédiatement si Nuane décide de réfréner sa taille à nouveau
    (action automatique).</p><p>De plus, chaque fois qu’elle réalise une
    merveille (p. 31 du kit), son joueur peut lui choisir un nouveau pouvoir
    dans la liste suivante, ou augmenter de 1 sa valeur de
    conscience.</p><ul><li><p>Iris de focalisation</p></li><li><p>Colosse
    tonitruant</p></li></ul>
