  utilise: false
  citation: >-
    D'une caresse mentale, j'ordonne à un de mes serpents de distiller son
    venin.
  description: >-
    <p>À l'acquisition de ce pouvoir, choisissez une harmonique. En une action,
    Céliana récolte un venin à consommer plus tard, ou tente de l'inoculer par
    morsure (action de nature). Jusqu'à la fin de la scène, au choix : • Le
    nombre de succès des actions en lien avec l'harmonique choisie et réalisées
    par l'envenimé augmente ou diminue de 1. • Les difficultés opposées par
    l'envenimé augmentent ou diminuent de 1. Par ailleurs, tous les venins
    alchimiques peuvent servir d'encres de conjuration.</p>
